name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:coverage
      - name: Secret scan (tracked files)
        run: |
          if git grep -n -E 'AEM_SERVICE_PASSWORD=admin|MCP_PASSWORD=admin' -- ':!.env.example' ':!docs/**' ':!README.md' ':!src/__tests__/**' ':!src/config.ts'; then
            echo 'Committed default credentials are not allowed'
            exit 1
          fi
      - name: High/critical audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aem-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
